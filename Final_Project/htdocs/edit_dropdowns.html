<div class="container">
  <div class="container">
  <div class="row">
    <!-- Vehicle Numbers Section -->
    <div class="col-md-6">
      <div class="section">
        <h4>Vehicle Numbers</h4>
        <ul id="vehicleList" class="list-group mb-3"></ul>
        <div class="input-group">
          <input type="text" id="newVehicle" class="form-control" placeholder="Enter New Vehicle Number">
          <button class="btn btn-success" onclick="addOption('vehicle')">Add Vehicle</button>
        </div>
      </div>
    </div>

    <!-- Bus Routes Section -->
    <div class="col-md-6">
      <div class="section">
        <h4>Bus Routes</h4>
        <ul id="routeList" class="list-group mb-3"></ul>
        <div class="input-group">
          <input type="text" id="newRoute" class="form-control" placeholder="Enter New Bus Route">
          <button class="btn btn-success" onclick="addOption('route')">Add Route</button>

<!-- Modal for Editing -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit Option</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="editValue" class="form-control" placeholder="Edit value">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="saveEdit()">Save changes</button>
      </div>
    </div>
  </div>
</div>

<script>
let data = {};
let editingType = '';
let editingIndex = -1;

function loadOptions() {
  $.getJSON("options_handler.php", function(res) {
    data = res;
    updateUI();
  });
}

function updateUI() {
  $("#vehicleList").empty();
  data.vehicleNumbers.forEach((val, index) => {
    $("#vehicleList").append(`
      <li class="list-item">
        <span>${val}</span>
        <div>
          <button class="btn btn-info btn-sm" data-bs-toggle="modal" data-bs-target="#editModal" onclick="prepareEdit('vehicle', ${index})">
            <i class="bi bi-pencil-square"></i> Edit
          </button>
<button class="btn btn-light-red shadow-sm btn-sm px-3" onclick="deleteOption('vehicle', ${index})">
  <i class="bi bi-trash-fill me-1"></i> Delete
</button>

        </div>
      </li>`);
  });

  $("#routeList").empty();
  data.busRoutes.forEach((val, index) => {
    $("#routeList").append(`
      <li class="list-item">
        <span>${val}</span>
        <div>
          <button class="btn btn-light-green btn-sm" data-bs-toggle="modal" data-bs-target="#editModal" onclick="prepareEdit('route', ${index})">
            <i class="bi bi-pencil-square"></i> Edit
          </button>
          <button class="btn btn-light-red shadow-sm btn-sm px-3m" onclick="deleteOption('route', ${index})">
            <i class="bi bi-trash-fill me-1"></i> Delete
          </button>
        </div>
      </li>`);
  });
}

function addOption(type) {
  const val = type === 'vehicle' ? $("#newVehicle").val().trim() : $("#newRoute").val().trim();
  if (!val) return alert("Please enter a value");

  if (type === 'vehicle') data.vehicleNumbers.push(val);
  else data.busRoutes.push(val);

  saveData();
}

function editOption(type, index) {
  const current = type === 'vehicle' ? data.vehicleNumbers[index] : data.busRoutes[index];
  const newVal = prompt("Enter new value:", current);
  if (newVal && newVal.trim()) {
    if (type === 'vehicle') data.vehicleNumbers[index] = newVal.trim();
    else data.busRoutes[index] = newVal.trim();
    saveData();
  }
}

function deleteOption(type, index) {
  if (type === 'vehicle') data.vehicleNumbers.splice(index, 1);
  else data.busRoutes.splice(index, 1);
  saveData();
}

function prepareEdit(type, index) {
  editingType = type;
  editingIndex = index;
  const current = type === 'vehicle' ? data.vehicleNumbers[index] : data.busRoutes[index];
  $("#editValue").val(current);
}

function saveEdit() {
  const newValue = $("#editValue").val().trim();
  if (newValue) {
    if (editingType === 'vehicle') data.vehicleNumbers[editingIndex] = newValue;
    else data.busRoutes[editingIndex] = newValue;
    saveData();
    $('#editModal').modal('hide');
  }
}

function saveData() {
  $.ajax({
    url: "options_handler.php",
    method: "POST",
    contentType: "application/json",
    data: JSON.stringify(data),
    success: loadOptions
  });
}

$(document).ready(loadOptions);
</script>
