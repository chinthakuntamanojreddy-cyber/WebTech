<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Management | Aditya Birla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('BG5.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .main-container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card-official {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .card-official h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 30px;
      color: #1e1e1e;
    }

    .btn-official {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 6px;
      margin-bottom: 20px;
      color: #fff;
      background-color: #0d6efd;
      border: none;
      transition: background 0.3s ease;
    }

    .btn-official:hover {
      background-color: #084cdf;
    }

    .footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
    }

    @media (max-width: 576px) {
      .card-official {
        padding: 30px 20px;
      }

      .card-official h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card-official">
      <h1>Vehicle Management System</h1>
      <a href="#" class="btn btn-official">Add Vehicle</a>
      <a href="#" class="btn btn-official">View Vehicles</a>
    </div>
  </div>

  <div class="footer">
    &copy; 2025 Aditya Birla Group — Vehicle Admin Portal
  </div>

</body>
</html>
