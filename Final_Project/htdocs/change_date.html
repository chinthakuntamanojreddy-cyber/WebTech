<!DOCTYPE html>
<html>
<head>
    <title>Change Date in Table</title>
</head>
<body>
    <h2>Update Date</h2>
    <form action="change_date.php" method="post">
        <label for="table">Select Table:</label>
        <select id="table" name="table" required>
            <option value="Auto_entry">Auto_entry</option>
            <option value="Bus_entry">Bus_entry</option>
        </select><br><br>

        <label for="before_date">Before Date:</label>
        <input type="date" id="before_date" name="before_date" required><br><br>

        <label for="after_date">After Date:</label>
        <input type="date" id="after_date" name="after_date" required><br><br>

        <input type="submit" value="Update Date">
    </form>
</body>
</html>
