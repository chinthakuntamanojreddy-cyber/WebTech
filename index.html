<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiments</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 36px;
        }

        header h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        header h2 {
            font-size: 15px;
            font-weight: normal;
            color: #555;
            margin-bottom: 8px;
        }

        header p {
            font-size: 13px;
            color: #777;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            max-width: 700px;
            margin: 0 auto;
        }

        .box {
            display: block;
            text-align: center;
            padding: 14px 8px;
            background-color: #1a1a2e;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .box:hover {
            background-color: #333;
            transform: translateY(-2px);
        }

        .box:last-child {
            background-color: #0f3460;
        }

        .box:last-child:hover {
            background-color: #1a4a80;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 18px; }
            header h2 { font-size: 13px; }
            nav { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .box { font-size: 12px; padding: 12px 6px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Web Development Laboratory Experiments</h1>
        <h2>A Collection of Practical Programs and Mini Projects</h2>
        <p>You can access all my web development experiments from here.</p>
    </header>

        <a href="exp8/index.html" class="box">Exp 8</a>
        <a href="exp9/index.html" class="box">Exp 9</a>
        <a href="exp10/index.html" class="box">Exp 10</a>
        <a href="https://vehiclesmanagement.infinityfreeapp.com/Login.php" class="box">Final Project</a>
    </nav>
</body>
</html>
